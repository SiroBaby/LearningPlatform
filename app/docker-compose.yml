services:
  postgres:
    image: postgres:16-alpine
    container_name: lp_postgres
    restart: unless-stopped
    environment:
      # Local fixture credentials only; never reuse them outside development.
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
      POSTGRES_DB: learning
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: lp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Local fixture credentials only; never reuse them outside development.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc@sha256:470f5546b596e16c7816b9c3fa7a78ce4076bb73c2c73f7faeec0c8043923123
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Local fixture credentials only; never reuse them outside development.
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 &&
        mc mb --ignore-existing local/documents >/dev/null 2>&1 &&
        mc mb --ignore-existing local/media >/dev/null 2>&1 &&
        mc version enable local/media >/dev/null 2>&1

volumes:
  pg_data:
  minio_data:
