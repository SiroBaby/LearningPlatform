---
- name: Verify internal PKI template contract without a cluster
  hosts: localhost
  gather_facts: false
  vars:
    learning_platform_namespace: learning-platform-dev
  tasks:
    - name: Render internal PKI manifests
      ansible.builtin.set_fact:
        internal_pki_documents: >-
          {{ lookup('template', '../templates/internal-pki.yaml.j2') | from_yaml_all | list }}

    - name: Require namespace-scoped short-lived identities and no inline private keys
      ansible.builtin.assert:
        that:
          - internal_pki_documents | length == 7
          - internal_pki_documents | map(attribute='metadata.namespace') | unique | list == [learning_platform_namespace]
          - internal_pki_documents[4].spec.duration == '24h'
          - internal_pki_documents[4].spec.renewBefore == '8h'
          - internal_pki_documents[4].spec.privateKey.rotationPolicy == 'Always'
          - internal_pki_documents[5].spec.duration == '24h'
          - internal_pki_documents[5].spec.renewBefore == '8h'
          - internal_pki_documents[5].spec.privateKey.rotationPolicy == 'Always'
          - internal_pki_documents | to_json is not search('tls\.key|BEGIN (RSA )?PRIVATE KEY')
          - internal_pki_documents[4].spec.uris == ['spiffe://learning-platform.local/ns/learning-platform-dev/sa/api-internal']
          - internal_pki_documents[5].spec.uris == ['spiffe://learning-platform.local/ns/learning-platform-dev/sa/go-worker']
          - internal_pki_documents[6].spec.policyTypes == ['Ingress']
          - "internal_pki_documents[6].spec.podSelector.matchLabels == {'app.kubernetes.io/name': 'learning-platform', 'app.kubernetes.io/component': 'api'}"
          - internal_pki_documents[6].spec.ingress | length == 3
          - "internal_pki_documents[6].spec.ingress[0].from[0].podSelector.matchLabels == {'app.kubernetes.io/name': 'learning-platform', 'app.kubernetes.io/component': 'worker'}"
          - "internal_pki_documents[6].spec.ingress[0].ports == [{'protocol': 'TCP', 'port': 3443}]"
          - "internal_pki_documents[6].spec.ingress[1].from[0].namespaceSelector.matchLabels == {'kubernetes.io/metadata.name': 'kube-system'}"
          - "internal_pki_documents[6].spec.ingress[1].from[0].podSelector.matchLabels == {'app.kubernetes.io/name': 'traefik'}"
          - "internal_pki_documents[6].spec.ingress[1].ports == [{'protocol': 'TCP', 'port': 3000}]"
          - "internal_pki_documents[6].spec.ingress[2].from[0].podSelector.matchLabels == {'app.kubernetes.io/name': 'learning-platform', 'app.kubernetes.io/component': 'web'}"
          - "internal_pki_documents[6].spec.ingress[2].ports == [{'protocol': 'TCP', 'port': 3000}]"
          - internal_pki_documents[6].spec is not search('egress')
