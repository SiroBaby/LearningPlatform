---
# ExternalSecrets are rendered for every target because a Secret created by an
# earlier rollout stays in the cluster while a later rollout selects fewer targets.
- name: Render Deployments and ExternalSecrets for one flag combination
  ansible.builtin.set_fact:
    secret_reference_deployments: >-
      {{ lookup('template', playbook_dir ~ '/../../../../k8s/apps.yaml.j2',
         template_vars={'deployment_targets': secret_reference_case[3],
                        'object_storage_egress_proxy_enabled': secret_reference_case[0],
                        'media_probe_worker_enabled': secret_reference_case[1],
                        'api_media_enabled': secret_reference_case[2],
                        'media_egress_proxy_enabled': true,
                        'media_probe_worker_image': 'ghcr.io/sirobaby/learningplatform-media-probe@sha256:' ~ ('d' * 64)})
         | from_yaml_all | list | selectattr('kind', 'equalto', 'Deployment') | list }}
    secret_reference_external_secrets: >-
      {{ ((lookup('template', playbook_dir ~ '/../../external_secrets/templates/external-secrets.yaml.j2',
          template_vars={'deployment_targets': ['web', 'api', 'worker'],
                         'object_storage_egress_proxy_enabled': secret_reference_case[0],
                         'media_probe_worker_enabled': secret_reference_case[1],
                         'api_media_enabled': secret_reference_case[2]})
          | from_yaml_all | list)
         + (lookup('template', playbook_dir ~ '/../../../../k8s/swagger-external-secret.yaml.j2')
          | from_yaml_all | list))
         | selectattr('kind', 'equalto', 'ExternalSecret') | list }}
  no_log: true

- name: Collect every Deployment secretKeyRef
  ansible.builtin.set_fact:
    secret_reference_refs: >-
      {{ secret_reference_deployments
         | map(attribute='spec.template.spec.containers') | flatten
         | selectattr('env', 'defined') | map(attribute='env') | flatten
         | selectattr('valueFrom', 'defined') | map(attribute='valueFrom')
         | selectattr('secretKeyRef', 'defined') | map(attribute='secretKeyRef')
         | list }}
  no_log: true

- name: Reset the provided secret keys for this combination
  ansible.builtin.set_fact:
    secret_reference_provided: {}

# ESO names the target Secret after the ExternalSecret when spec.target.name is omitted.
- name: Index provided keys by target Secret name
  ansible.builtin.set_fact:
    secret_reference_provided: >-
      {{ secret_reference_provided | combine({
           (item.spec.target.name | default(item.metadata.name)):
             item.spec.data | map(attribute='secretKey') | list }) }}
  loop: "{{ secret_reference_external_secrets }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  no_log: true

- name: Require each secretKeyRef to resolve to a rendered ExternalSecret key
  ansible.builtin.assert:
    that:
      - item.name in secret_reference_provided
      - item.key in secret_reference_provided[item.name]
    fail_msg: >-
      Secret {{ item.name }} does not provide key {{ item.key }} for
      egress={{ secret_reference_case[0] }} probe={{ secret_reference_case[1] }}
      api_media={{ secret_reference_case[2] }} targets={{ secret_reference_case[3] | join(',') }}.
  loop: "{{ secret_reference_refs }}"
  loop_control:
    label: "{{ item.name }}/{{ item.key }}"

# Go workers must verify PostgreSQL TLS (#198): DB_SSL_MODE/DB_SSL_CA come from
# the same Secret as DB_HOST so the CA always matches the configured server.
- name: Collect Go worker containers that connect to PostgreSQL
  ansible.builtin.set_fact:
    secret_reference_go_database_containers: >-
      {{ secret_reference_deployments
         | map(attribute='spec.template.spec.containers') | flatten
         | selectattr('name', 'in', ['go-worker', 'media-probe-worker'])
         | list }}
  no_log: true

- name: Require one Go database container per rendered Go worker
  ansible.builtin.assert:
    that:
      - >-
        secret_reference_go_database_containers | map(attribute='name') | list
        == (['go-worker'] if 'worker' in secret_reference_case[3] else [])
           + (['media-probe-worker'] if 'worker' in secret_reference_case[3] and secret_reference_case[1] else [])
    fail_msg: Unexpected Go worker containers for targets={{ secret_reference_case[3] | join(',') }} probe={{ secret_reference_case[1] }}.

- name: Require Go workers to read DB_SSL_MODE and DB_SSL_CA from the DB_HOST Secret
  ansible.builtin.assert:
    that:
      - item.env | selectattr('name', 'equalto', 'DB_HOST') | list | length == 1
      - >-
        item.env | selectattr('name', 'in', ['DB_SSL_MODE', 'DB_SSL_CA'])
        | map(attribute='valueFrom.secretKeyRef.name') | list
        == [(item.env | selectattr('name', 'equalto', 'DB_HOST') | first).valueFrom.secretKeyRef.name] * 2
    fail_msg: Container {{ item.name }} must receive DB_SSL_MODE and DB_SSL_CA from its DB_HOST Secret.
  loop: "{{ secret_reference_go_database_containers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Require every DB_SSL_* ExternalSecret entry to read the shared API SSM parameters
  ansible.builtin.assert:
    that:
      - >-
        item.remoteRef.key
        == (ssm_parameter_keys.db_ssl_mode if item.secretKey == 'DB_SSL_MODE' else ssm_parameter_keys.db_ssl_ca)
    fail_msg: ExternalSecret entry {{ item.secretKey }} must use the shared database TLS SSM parameter.
  loop: >-
    {{ secret_reference_external_secrets | map(attribute='spec.data') | flatten
       | selectattr('secretKey', 'in', ['DB_SSL_MODE', 'DB_SSL_CA']) | list }}
  loop_control:
    label: "{{ item.secretKey }}"
