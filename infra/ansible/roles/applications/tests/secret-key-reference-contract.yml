---
# Every Deployment secretKeyRef must name a rendered ExternalSecret target that
# provides that key, for each flag combination the shared templates support.
- name: Verify Deployment secret references against rendered ExternalSecrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../../vars/dev.yml
  vars:
    learning_platform_namespace: learning-platform-dev
    web_image: ghcr.io/sirobaby/learningplatform-web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    api_image: ghcr.io/sirobaby/learningplatform-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    worker_image: ghcr.io/sirobaby/learningplatform-api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    go_worker_image: ghcr.io/sirobaby/learningplatform-ai-worker@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    secret_reference_target_sets:
      - [api]
      - [worker]
      - [api, worker]
      - [web, api, worker]
  tasks:
    - name: Check every flag and target combination
      ansible.builtin.include_tasks: secret-key-reference-case.yml
      loop: >-
        {{ [true, false]
           | product([true, false], [true, false], secret_reference_target_sets)
           | list }}
      loop_control:
        loop_var: secret_reference_case
        label: >-
          egress={{ secret_reference_case[0] }} probe={{ secret_reference_case[1] }}
          api_media={{ secret_reference_case[2] }} targets={{ secret_reference_case[3] | join(',') }}
