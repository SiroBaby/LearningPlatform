---
- name: Verify API media storage rollout contract
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../../vars/dev.yml
  vars:
    learning_platform_namespace: learning-platform-dev
    deployment_targets: [api]
    ghcr_pull_secret_name: learning-platform-dev-ghcr
    web_public_host: learningplatform-dev.example.test
    api_public_host: learningplatform-dev-api.example.test
    ingress_tls_secret_name: ''
    api_image: ghcr.io/sirobaby/learningplatform-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    web_image: ghcr.io/sirobaby/learningplatform-web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    worker_image: ghcr.io/sirobaby/learningplatform-api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    api_resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits: {cpu: '1', memory: 512Mi}
    api_media_enabled: false
  tasks:
    - name: Render the default disabled API media manifest
      ansible.builtin.set_fact:
        api_media_enabled: false
        applications_rendered_disabled_manifests: >-
          {{ lookup('template', playbook_dir ~ '/../../../../k8s/apps.yaml.j2') | from_yaml_all | list }}
        applications_rendered_disabled_external_secrets: >-
          {{ lookup('template', playbook_dir ~ '/../../external_secrets/templates/external-secrets.yaml.j2') | from_yaml_all | list }}

    - name: Select the disabled API workload and runtime Secret
      ansible.builtin.set_fact:
        applications_disabled_api_deployments: >-
          {{ applications_rendered_disabled_manifests
             | selectattr('kind', 'equalto', 'Deployment')
             | selectattr('metadata.name', 'equalto', 'api')
             | list }}
        applications_disabled_api_runtime: >-
          {{ applications_rendered_disabled_external_secrets
             | selectattr('kind', 'equalto', 'ExternalSecret')
             | selectattr('metadata.name', 'equalto', 'learning-platform-api-runtime')
             | first }}

    - name: Require API media to remain disabled by default
      ansible.builtin.assert:
        that:
          - applications_disabled_api_deployments | length == 1
          - applications_disabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'NODE_ENV') | map(attribute='value') | list == ['production']
          - applications_disabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_MEDIA_ENABLED') | map(attribute='value') | list == ['false']
          - applications_disabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_MEDIA_BUCKET') | list | length == 0
          - applications_disabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_API_MEDIA_ACCESS_KEY') | list | length == 0
          - applications_disabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_API_MEDIA_SECRET_KEY') | list | length == 0
          - applications_disabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_EGRESS_PROXY_URL') | list | length == 0
          - >-
            (applications_disabled_api_runtime.spec.data
             | map(attribute='secretKey') | list
             | intersect(['OBJECT_STORAGE_MEDIA_BUCKET',
                         'OBJECT_STORAGE_API_MEDIA_ACCESS_KEY',
                         'OBJECT_STORAGE_API_MEDIA_SECRET_KEY'])) == []
        fail_msg: >-
          The default K3s rollout must keep API media disabled and must not
          materialize optional media credentials before the feature is enabled.

    - name: Enable the valid API media rollout scenario
      ansible.builtin.set_fact:
        api_media_enabled: true
        object_storage_egress_proxy_enabled: true

    - name: Render the valid enabled API media manifest
      ansible.builtin.set_fact:
        applications_rendered_enabled_manifests: >-
          {{ lookup('template', playbook_dir ~ '/../../../../k8s/apps.yaml.j2') | from_yaml_all | list }}
        applications_rendered_enabled_external_secrets: >-
          {{ lookup('template', playbook_dir ~ '/../../external_secrets/templates/external-secrets.yaml.j2') | from_yaml_all | list }}

    - name: Select the enabled API workload and runtime Secret
      ansible.builtin.set_fact:
        applications_enabled_api_deployments: >-
          {{ applications_rendered_enabled_manifests
             | selectattr('kind', 'equalto', 'Deployment')
             | selectattr('metadata.name', 'equalto', 'api')
             | list }}
        applications_enabled_api_runtime: >-
          {{ applications_rendered_enabled_external_secrets
             | selectattr('kind', 'equalto', 'ExternalSecret')
             | selectattr('metadata.name', 'equalto', 'learning-platform-api-runtime')
             | first }}

    - name: Require the valid enabled API media wiring
      ansible.builtin.assert:
        that:
          - applications_enabled_api_deployments | length == 1
          - applications_enabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'NODE_ENV') | map(attribute='value') | list == ['production']
          - applications_enabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_MEDIA_ENABLED') | map(attribute='value') | list == ['true']
          - applications_enabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_MEDIA_BUCKET') | map(attribute='valueFrom.secretKeyRef.name') | list == ['learning-platform-api-runtime']
          - applications_enabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_API_MEDIA_ACCESS_KEY') | map(attribute='valueFrom.secretKeyRef.name') | list == ['learning-platform-api-runtime']
          - applications_enabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_API_MEDIA_SECRET_KEY') | map(attribute='valueFrom.secretKeyRef.name') | list == ['learning-platform-api-runtime']
          - applications_enabled_api_deployments[0].spec.template.spec.containers[0].env | selectattr('name', 'equalto', 'OBJECT_STORAGE_EGRESS_PROXY_URL') | map(attribute='valueFrom.secretKeyRef.name') | list == ['learning-platform-api-runtime']
          - >-
            (applications_enabled_api_runtime.spec.data
             | selectattr('secretKey', 'equalto', 'OBJECT_STORAGE_MEDIA_BUCKET')
             | map(attribute='remoteRef.key') | list)
            == [ssm_parameter_keys.object_storage_media_bucket]
          - applications_enabled_api_deployments[0].spec.template.spec.containers[0].env | to_json is not search('learning-platform-media-probe-runtime')
        fail_msg: >-
          A valid API media rollout must enable the feature and source the
          canonical media bucket, dedicated API credentials, and approved
          object-storage proxy from the API runtime Secret.

    - name: Load the application rollout gate source
      ansible.builtin.set_fact:
        applications_role_tasks_source: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/main.yml') }}

    - name: Require a conditional fail-closed API media rollout gate
      ansible.builtin.assert:
        that:
          - "'- name: Reject API media storage in production' not in applications_role_tasks_source"
          - "'- name: Validate enabled API media storage contract' in applications_role_tasks_source"
          - "'when: api_media_enabled | default(false) | bool' in applications_role_tasks_source"
          - "applications_role_tasks_source.find('- name: Validate enabled API media storage contract') < applications_role_tasks_source.find('- name: Wait for API runtime ExternalSecret readiness')"
          - "applications_role_tasks_source.find('- name: Validate enabled API media storage contract') < applications_role_tasks_source.find('- name: Apply selected stateless Learning Platform workloads')"
          - "\"ssm_parameter_keys.object_storage_egress_proxy_url is not search('REPLACE_WITH')\" in applications_role_tasks_source"
          - "\"ssm_parameter_keys.object_storage_media_bucket is not search('REPLACE_WITH')\" in applications_role_tasks_source"
          - "\"ssm_parameter_keys.object_storage_api_media_access_key is not search('REPLACE_WITH')\" in applications_role_tasks_source"
          - "\"ssm_parameter_keys.object_storage_api_media_secret_key is not search('REPLACE_WITH')\" in applications_role_tasks_source"
        fail_msg: >-
          API media must be optional by default, enabled only under the
          canonical SSM/proxy contract, and validated before runtime Secret
          readiness and workload application.
