---
# The credit reconciler (#275) writes the credit ledger, so it must ship OFF and
# report-only, apply only when both flags say so, run only in the relay-only
# `worker` container, and take its non-secret tuning from manifest literals.
- name: Verify the credit reconciler defaults when the flags are absent
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    learning_platform_namespace: learning-platform-dev
    deployment_targets: [web, api, worker]
    ghcr_pull_secret_name: learning-platform-dev-ghcr
    web_public_host: learningplatform-dev.example.test
    api_public_host: learningplatform-dev-api.example.test
    ingress_tls_secret_name: ''
    web_image: ghcr.io/sirobaby/learningplatform-web@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    web_resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
    api_image: ghcr.io/sirobaby/learningplatform-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    api_resources:
      requests: {cpu: 200m, memory: 256Mi}
      limits: {cpu: '1', memory: 512Mi}
    worker_image: ghcr.io/sirobaby/learningplatform-api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    go_worker_image: ghcr.io/sirobaby/learningplatform-ai-worker@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    worker_resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: '1', memory: 1Gi}
    go_worker_resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: '1', memory: 1Gi}
    credit_reconciler_literals:
      CREDIT_RECONCILER_INTERVAL_MS: '300000'
      CREDIT_RECONCILER_ORPHAN_GRACE_MS: '1800000'
      CREDIT_RECONCILER_HELD_RELEASE_AFTER_MS: '86400000'
      CREDIT_RECONCILER_BATCH_SIZE: '50'
  tasks:
    - name: Render the worker manifests with no, apply and dry-run flag values
      ansible.builtin.set_fact:
        reconciler_default_manifests: >-
          {{ lookup('template', playbook_dir ~ '/../../../../k8s/apps.yaml.j2') | from_yaml_all | list }}
        reconciler_apply_manifests: >-
          {{ lookup('template', playbook_dir ~ '/../../../../k8s/apps.yaml.j2',
             template_vars={'credit_reconciler_enabled': true, 'credit_reconciler_dry_run': false})
             | from_yaml_all | list }}
        reconciler_report_only_manifests: >-
          {{ lookup('template', playbook_dir ~ '/../../../../k8s/apps.yaml.j2',
             template_vars={'credit_reconciler_enabled': true, 'credit_reconciler_dry_run': true})
             | from_yaml_all | list }}
      no_log: true

    - name: Select the Node worker container env of each render
      ansible.builtin.set_fact:
        reconciler_default_env: >-
          {{ ((reconciler_default_manifests | selectattr('kind', 'equalto', 'Deployment')
               | selectattr('metadata.name', 'equalto', 'worker') | first)
              .spec.template.spec.containers | selectattr('name', 'equalto', 'worker') | first).env }}
        reconciler_apply_env: >-
          {{ ((reconciler_apply_manifests | selectattr('kind', 'equalto', 'Deployment')
               | selectattr('metadata.name', 'equalto', 'worker') | first)
              .spec.template.spec.containers | selectattr('name', 'equalto', 'worker') | first).env }}
        reconciler_report_only_env: >-
          {{ ((reconciler_report_only_manifests | selectattr('kind', 'equalto', 'Deployment')
               | selectattr('metadata.name', 'equalto', 'worker') | first)
              .spec.template.spec.containers | selectattr('name', 'equalto', 'worker') | first).env }}
        reconciler_go_worker_env_names: >-
          {{ ((reconciler_default_manifests | selectattr('kind', 'equalto', 'Deployment')
               | selectattr('metadata.name', 'equalto', 'worker') | first)
              .spec.template.spec.containers | selectattr('name', 'equalto', 'go-worker') | first).env
             | map(attribute='name') | list }}
      no_log: true

    - name: Require the reconciler to ship off and report-only, and to apply only when asked
      ansible.builtin.assert:
        that:
          - >-
            reconciler_default_env | selectattr('name', 'in', ['CREDIT_RECONCILER_ENABLED', 'CREDIT_RECONCILER_DRY_RUN'])
            | map(attribute='value') | list == ['false', 'true']
          - >-
            reconciler_apply_env | selectattr('name', 'in', ['CREDIT_RECONCILER_ENABLED', 'CREDIT_RECONCILER_DRY_RUN'])
            | map(attribute='value') | list == ['true', 'false']
          - >-
            reconciler_report_only_env | selectattr('name', 'in', ['CREDIT_RECONCILER_ENABLED', 'CREDIT_RECONCILER_DRY_RUN'])
            | map(attribute='value') | list == ['true', 'true']
        fail_msg: >-
          credit_reconciler_enabled must default false and credit_reconciler_dry_run must default true;
          apply mode renders only when enabled is true and dry_run is false.

    - name: Require the tuning to be non-secret manifest literals on the Node worker only
      ansible.builtin.assert:
        that:
          - >-
            reconciler_default_env | selectattr('name', 'search', '^CREDIT_RECONCILER_')
            | rejectattr('name', 'in', ['CREDIT_RECONCILER_ENABLED', 'CREDIT_RECONCILER_DRY_RUN'])
            | list | items2dict(key_name='name', value_name='value') == credit_reconciler_literals
          - reconciler_default_env | selectattr('name', 'search', '^CREDIT_RECONCILER_') | selectattr('valueFrom', 'defined') | list | length == 0
          - reconciler_go_worker_env_names | select('search', 'CREDIT_RECONCILER') | list | length == 0
          - >-
            reconciler_default_manifests | selectattr('metadata.name', 'ne', 'worker')
            | map('to_json') | select('search', 'CREDIT_RECONCILER') | list | length == 0
        fail_msg: >-
          The credit reconciler settings are non-secret literals of the Node worker container;
          they must not come from a Secret, appear in go-worker, or leak to another workload.

- name: Verify the credit reconciler flags against the production dev vars
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../../vars/dev.yml
  vars:
    learning_platform_namespace: learning-platform-dev
    web_image: ghcr.io/sirobaby/learningplatform-web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    api_image: ghcr.io/sirobaby/learningplatform-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    worker_image: ghcr.io/sirobaby/learningplatform-api@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    go_worker_image: ghcr.io/sirobaby/learningplatform-ai-worker@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    media_probe_worker_image: ghcr.io/sirobaby/learningplatform-media-probe@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  tasks:
    - name: Require explicit boolean reconciler flags in the dev vars
      ansible.builtin.assert:
        that:
          - credit_reconciler_enabled is boolean
          - credit_reconciler_dry_run is boolean
        fail_msg: vars/dev.yml must declare credit_reconciler_enabled and credit_reconciler_dry_run as YAML booleans.

    - name: Render the real dev worker without any flag override
      ansible.builtin.set_fact:
        reconciler_real_dev_env: >-
          {{ ((lookup('template', playbook_dir ~ '/../../../../k8s/apps.yaml.j2')
               | from_yaml_all | list | selectattr('kind', 'equalto', 'Deployment')
               | selectattr('metadata.name', 'equalto', 'worker') | first)
              .spec.template.spec.containers | selectattr('name', 'equalto', 'worker') | first).env }}
      no_log: true

    - name: Require the rendered dev worker to match the dev flags
      ansible.builtin.assert:
        that:
          - >-
            reconciler_real_dev_env | selectattr('name', 'in', ['CREDIT_RECONCILER_ENABLED', 'CREDIT_RECONCILER_DRY_RUN'])
            | map(attribute='value') | list
            == [credit_reconciler_enabled | bool | lower | string, credit_reconciler_dry_run | bool | lower | string]
        fail_msg: >-
          Rendering the real vars/dev.yml must give the Node worker CREDIT_RECONCILER_ENABLED and
          CREDIT_RECONCILER_DRY_RUN exactly as the dev flags say.
