---
- name: Validate immutable application image references and resource variables
  ansible.builtin.assert:
    that:
      - "'web' not in deployment_targets or web_image is match('^ghcr\\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$')"
      - "'api' not in deployment_targets or api_image is match('^ghcr\\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$')"
      - "'worker' not in deployment_targets or worker_image is match('^ghcr\\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$')"
      - "'worker' not in deployment_targets or go_worker_image is match('^ghcr\\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$')"
      - web_resources is mapping
      - api_resources is mapping
      - worker_resources is mapping
      - go_worker_resources is mapping
      - deployment_targets is sequence
      - deployment_targets is not string
      - deployment_targets | length > 0
      - deployment_targets | difference(['web', 'api', 'worker']) | length == 0
      - deployment_targets | unique | length == deployment_targets | length
      - ghcr_pull_secret_name is string
      - ghcr_pull_secret_name | length > 0
      - ghcr_pull_secret_name is not search('REPLACE_WITH')
      - web_public_host is string
      - web_public_host | length > 0
      - web_public_host is not search('REPLACE_WITH')
      - api_public_host is string
      - api_public_host | length > 0
      - api_public_host is not search('REPLACE_WITH')
      - web_public_host != api_public_host
      - ingress_tls_secret_name is string
      - ssm_parameter_keys.swagger_username is string
      - ssm_parameter_keys.swagger_password is string
      - ssm_parameter_keys.swagger_username is search('^/')
      - ssm_parameter_keys.swagger_password is search('^/')
      - ssm_parameter_keys.swagger_username is not search('REPLACE_WITH')
      - ssm_parameter_keys.swagger_password is not search('REPLACE_WITH')
      - ssm_parameter_keys.google_client_id is string
      - ssm_parameter_keys.google_client_secret is string
      - ssm_parameter_keys.google_redirect_uri is string
      - ssm_parameter_keys.auth_oauth_encryption_key is string
      - ssm_parameter_keys.auth_admin_google_subs is string
      - ssm_parameter_keys.auth_external_approval_public_key is string
      - ssm_parameter_keys.auth_external_approval_issuer is string
      - ssm_parameter_keys.auth_external_approval_audience is string
      - ssm_parameter_keys.google_client_id is search('^/')
      - ssm_parameter_keys.google_client_secret is search('^/')
      - ssm_parameter_keys.google_redirect_uri is search('^/')
      - ssm_parameter_keys.auth_oauth_encryption_key is search('^/')
      - ssm_parameter_keys.auth_admin_google_subs is search('^/')
      - ssm_parameter_keys.auth_external_approval_public_key is search('^/')
      - ssm_parameter_keys.auth_external_approval_issuer is search('^/')
      - ssm_parameter_keys.auth_external_approval_audience is search('^/')
      - ssm_parameter_keys.google_client_id is not search('REPLACE_WITH')
      - ssm_parameter_keys.google_client_secret is not search('REPLACE_WITH')
      - ssm_parameter_keys.google_redirect_uri is not search('REPLACE_WITH')
      - ssm_parameter_keys.auth_oauth_encryption_key is not search('REPLACE_WITH')
      - ssm_parameter_keys.auth_admin_google_subs is not search('REPLACE_WITH')
      - ssm_parameter_keys.auth_external_approval_public_key is not search('REPLACE_WITH')
      - ssm_parameter_keys.auth_external_approval_issuer is not search('REPLACE_WITH')
      - ssm_parameter_keys.auth_external_approval_audience is not search('REPLACE_WITH')
    fail_msg: >-
      Application images must be lowercase ghcr.io immutable sha256 digests,
      deployment_targets must contain only web, api, and worker, and GHCR/
      ingress configuration must be explicit.

- name: Validate enabled media egress proxy deployment contract
  ansible.builtin.assert:
    that:
      - media_egress_proxy_enabled | default(false) | bool
      - media_probe_worker_dns_ip is string
      - media_probe_worker_dns_ip is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - media_probe_worker_dns_ip is not search('REPLACE_WITH')
      - media_probe_worker_egress_proxy_port is number
      - media_probe_worker_egress_proxy_port | int == 3128
    fail_msg: >-
      An enabled media egress proxy requires an explicit cluster DNS address
      and the fixed in-cluster proxy port; it does not require the runtime
      object-storage proxy URL or any consumer credentials.
  when: media_egress_proxy_enabled | default(false) | bool

- name: Require the proxy deployment gate for runtime proxy consumers
  ansible.builtin.assert:
    that:
      - media_egress_proxy_enabled | default(false) | bool
      - media_probe_worker_proxy_url is string
      - media_probe_worker_proxy_url is match('^https?://[A-Za-z0-9.-]+:[0-9]+$')
      - media_probe_worker_proxy_url is not search('REPLACE_WITH')
    fail_msg: >-
      Runtime proxy consumers cannot be enabled until the private media egress
      proxy deployment is enabled, and they route through the explicit
      in-cluster proxy URL literal media_probe_worker_proxy_url.
  when: object_storage_egress_proxy_enabled | default(false) | bool

- name: Validate the media probe worker contract when it is enabled
  ansible.builtin.include_tasks: media-probe-contract.yml

- name: Validate the document purge worker contract when it is enabled
  ansible.builtin.include_tasks: document-purge-contract.yml

- name: Validate enabled API media storage contract
  ansible.builtin.assert:
    that:
      - ssm_parameter_keys.object_storage_media_bucket is string
      - ssm_parameter_keys.object_storage_api_media_access_key is string
      - ssm_parameter_keys.object_storage_api_media_secret_key is string
      - ssm_parameter_keys.object_storage_media_bucket is search('^/')
      - ssm_parameter_keys.object_storage_api_media_access_key is search('^/')
      - ssm_parameter_keys.object_storage_api_media_secret_key is search('^/')
      - ssm_parameter_keys.object_storage_media_bucket is not search('REPLACE_WITH')
      - ssm_parameter_keys.object_storage_api_media_access_key is not search('REPLACE_WITH')
      - ssm_parameter_keys.object_storage_api_media_secret_key is not search('REPLACE_WITH')
      - object_storage_egress_proxy_enabled | default(false) | bool
    fail_msg: >-
      Enabled API media storage requires the canonical media bucket, dedicated
      API media credentials, and the explicitly enabled in-cluster
      object-storage egress proxy; media-probe credentials must not be reused.
  when: api_media_enabled | default(false) | bool

- name: Discover existing Learning Platform workload deployments
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ learning_platform_namespace }}'
  register: applications_learning_platform_deployments

- name: Select existing Learning Platform workload deployment names
  ansible.builtin.set_fact:
    applications_existing_workload_names: >-
      {{ applications_learning_platform_deployments.resources
         | map(attribute='metadata.name')
         | list
         | intersect(['web', 'api', 'worker']) }}

- name: Require complete target selection for the first application deployment
  ansible.builtin.assert:
    that:
      - deployment_targets | sort == ['api', 'web', 'worker'] | sort
    fail_msg: >-
      The first application deployment must select web, api, and worker so
      their shared runtime contract is established together.
  when: applications_existing_workload_names | length == 0

- name: Verify manually provisioned GHCR pull Secret
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Secret
    namespace: '{{ learning_platform_namespace }}'
    name: '{{ ghcr_pull_secret_name }}'
  register: applications_ghcr_pull_secret

- name: Require a dockerconfigjson GHCR pull Secret before workload rollout
  ansible.builtin.assert:
    that:
      - applications_ghcr_pull_secret.resources | length == 1
      - applications_ghcr_pull_secret.resources[0].type | default('') == 'kubernetes.io/dockerconfigjson'
      - "'.dockerconfigjson' in (applications_ghcr_pull_secret.resources[0].data | default({}))"
    fail_msg: >-
      Manually provision Secret {{ ghcr_pull_secret_name }} in namespace
      {{ learning_platform_namespace }} with type kubernetes.io/dockerconfigjson
      before deploying application pods.

- name: Verify configured ingress TLS Secret exists
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Secret
    namespace: '{{ learning_platform_namespace }}'
    name: '{{ ingress_tls_secret_name }}'
  register: applications_ingress_tls_secret
  when: ingress_tls_secret_name | length > 0

- name: Require configured ingress TLS Secret
  ansible.builtin.assert:
    that:
      - applications_ingress_tls_secret.resources | length == 1
      - applications_ingress_tls_secret.resources[0].type | default('') == 'kubernetes.io/tls'
    fail_msg: >-
      ingress_tls_secret_name is configured but the referenced kubernetes.io/tls
      Secret does not exist in {{ learning_platform_namespace }}.
  when: ingress_tls_secret_name | length > 0

- name: Apply API-only Swagger runtime ExternalSecret
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ lookup('template', playbook_dir ~ '/../../k8s/swagger-external-secret.yaml.j2') | from_yaml }}"
  when: "'api' in deployment_targets"

- name: Wait for API-only Swagger runtime ExternalSecret readiness
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: '{{ learning_platform_namespace }}'
    name: learning-platform-swagger-runtime
  register: applications_swagger_runtime_external_secret
  retries: 30
  delay: 2
  until: >-
    applications_swagger_runtime_external_secret.resources | length == 1 and
    (applications_swagger_runtime_external_secret.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list | length) == 1
  when: "'api' in deployment_targets or 'worker' in deployment_targets"

- name: Wait for API runtime ExternalSecret readiness
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: '{{ learning_platform_namespace }}'
    name: learning-platform-api-runtime
  register: applications_api_runtime_external_secret
  retries: 30
  delay: 2
  until: >-
    applications_api_runtime_external_secret.resources | length == 1 and
    (applications_api_runtime_external_secret.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list | length) == 1
  when: "'api' in deployment_targets"

- name: Wait for worker runtime ExternalSecret readiness
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: '{{ learning_platform_namespace }}'
    name: learning-platform-worker-runtime
  register: applications_worker_runtime_external_secret
  retries: 30
  delay: 2
  until: >-
    applications_worker_runtime_external_secret.resources | length == 1 and
    (applications_worker_runtime_external_secret.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list | length) == 1
  when: "'worker' in deployment_targets"

- name: Wait for media probe runtime ExternalSecret readiness
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: '{{ learning_platform_namespace }}'
    name: learning-platform-media-probe-runtime
  register: applications_media_probe_runtime_external_secret
  retries: 30
  delay: 2
  until: >-
    applications_media_probe_runtime_external_secret.resources | length == 1 and
    (applications_media_probe_runtime_external_secret.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list | length) == 1
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"

- name: Wait for document purge runtime ExternalSecret readiness
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: external-secrets.io/v1beta1
    kind: ExternalSecret
    namespace: '{{ learning_platform_namespace }}'
    name: learning-platform-document-purge-runtime
  register: applications_document_purge_runtime_external_secret
  retries: 30
  delay: 2
  until: >-
    applications_document_purge_runtime_external_secret.resources | length == 1 and
    (applications_document_purge_runtime_external_secret.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list | length) == 1
  when: "'worker' in deployment_targets and document_purge_enabled | default(false) | bool"

# Turning document_purge_enabled back to false must stop every hard delete.
# Applying the template only creates or updates objects, so remove the purge
# workload first and wait until its pod is gone: the namespace has no default
# deny, so deleting the NetworkPolicies earlier would leave a running pod that
# holds the purge credential with unrestricted egress. Then remove its exact
# named network, identity, and runtime ExternalSecret; ESO garbage-collects the
# owned Secret.
- name: Remove the document purge workload when its flag is disabled
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ learning_platform_namespace }}'
    name: document-purge-worker
    state: absent
    delete_options:
      propagationPolicy: Foreground
    wait: true
    wait_timeout: 120
  when: "'worker' in deployment_targets and not (document_purge_enabled | default(false) | bool)"

- name: Wait until no document purge pod is left before removing its NetworkPolicies
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Pod
    namespace: '{{ learning_platform_namespace }}'
    label_selectors:
      - app.kubernetes.io/name=learning-platform
      - app.kubernetes.io/component=document-purge-worker
  register: applications_document_purge_pods
  retries: 30
  delay: 5
  until: applications_document_purge_pods.resources | length == 0
  when: "'worker' in deployment_targets and not (document_purge_enabled | default(false) | bool)"
  no_log: true

- name: Remove the document purge network, identity, and runtime Secret when its flag is disabled
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: '{{ item.api_version }}'
    kind: '{{ item.kind }}'
    namespace: '{{ learning_platform_namespace }}'
    name: '{{ item.name }}'
    state: absent
  loop:
    - {api_version: networking.k8s.io/v1, kind: NetworkPolicy, name: document-purge-worker-egress}
    - {api_version: networking.k8s.io/v1, kind: NetworkPolicy, name: document-purge-worker-ingress}
    - {api_version: v1, kind: ServiceAccount, name: document-purge-worker}
    - {api_version: external-secrets.io/v1beta1, kind: ExternalSecret, name: learning-platform-document-purge-runtime}
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  when: "'worker' in deployment_targets and not (document_purge_enabled | default(false) | bool)"

# DB_HOST/DB_PORT of media-probe-worker are now literal values. A strategic
# merge onto an older Deployment that still sources them from secretKeyRef
# would produce an env entry with both value and valueFrom, which the API
# rejects; fail closed before any mutation instead (#199).
- name: Read an existing media probe worker Deployment
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ learning_platform_namespace }}'
    name: media-probe-worker
  register: applications_existing_media_probe_deployment
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"
  no_log: true

- name: Require no legacy secret-sourced database address on the media probe worker
  ansible.builtin.assert:
    that:
      - >-
        applications_existing_media_probe_deployment.resources
        | map(attribute='spec.template.spec.containers') | flatten
        | selectattr('name', 'equalto', 'media-probe-worker')
        | map(attribute='env') | flatten
        | selectattr('name', 'in', ['DB_HOST', 'DB_PORT'])
        | selectattr('valueFrom', 'defined')
        | list | length == 0
    fail_msg: >-
      deployment/media-probe-worker still reads DB_HOST/DB_PORT from a Secret;
      it predates the media-probe-db-egress forwarder and must be removed
      through a reviewed change before this rollout.
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"

# The probe pings PostgreSQL at startup, so the forwarder must be serving
# before the probe exists; otherwise the first rollout starts in CrashLoopBackOff.
- name: Select the media probe database forwarder resources
  ansible.builtin.set_fact:
    applications_forwarder_resources: >-
      {{ lookup('template', playbook_dir ~ '/../../k8s/apps.yaml.j2') | from_yaml_all
         | selectattr('metadata.name', 'match', '^media-probe-db-egress(-config|-ingress|-egress)?$') | list }}
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"

# With wait the module applies and awaits each document in list order, so every
# dependency (ServiceAccount, ConfigMap, Service, NetworkPolicy) must exist
# before the Deployment is awaited; otherwise its pods are rejected.
- name: Apply the media probe database forwarder dependencies
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ applications_forwarder_resources | rejectattr('kind', 'equalto', 'Deployment') | list }}"
    wait: true
    wait_timeout: 180
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"

# A ReplicaSet that failed to create pods (for example before its ServiceAccount
# existed) retries with a backoff of up to ~1000s, does not watch
# ServiceAccounts, and an unchanged template apply is a no-op, so the wait below
# would time out. Restart only such a stuck Deployment; a healthy or absent one
# is left untouched (#199).
- name: Read an existing media probe database forwarder Deployment
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ learning_platform_namespace }}'
    name: media-probe-db-egress
  register: applications_existing_forwarder_deployment
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"
  no_log: true

- name: Detect a media probe database forwarder Deployment stuck on FailedCreate
  ansible.builtin.set_fact:
    applications_forwarder_restart_required: >-
      {{ applications_existing_forwarder_deployment.resources
         | map(attribute='status.conditions', default=[]) | flatten
         | selectattr('type', 'equalto', 'ReplicaFailure')
         | selectattr('status', 'equalto', 'True')
         | selectattr('reason', 'defined')
         | selectattr('reason', 'equalto', 'FailedCreate')
         | list | length > 0 }}
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"

- name: Restart a media probe database forwarder Deployment stuck on FailedCreate
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ learning_platform_namespace }}'
    name: media-probe-db-egress
    state: patched
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ now(utc=True).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
  when:
    - "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"
    - applications_forwarder_restart_required | bool

- name: Apply the media probe database forwarder before its consumer
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ applications_forwarder_resources | selectattr('kind', 'equalto', 'Deployment') | list }}"
    wait: true
    wait_timeout: 180
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"

- name: Apply selected stateless Learning Platform workloads
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ lookup('template', playbook_dir ~ '/../../k8s/apps.yaml.j2') | from_yaml_all | list }}"

# The proxy ingress client list has no merge key, so the apply above replaces
# it; read it back to prove a disabled flag left no purge client rule behind.
- name: Read back the media egress proxy ingress policy
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: '{{ learning_platform_namespace }}'
    name: media-egress-proxy-ingress
  register: applications_media_egress_proxy_ingress_after_apply
  when:
    - media_egress_proxy_enabled | default(false) | bool
    - not (document_purge_enabled | default(false) | bool)

- name: Require a disabled purge flag to leave no purge client on the proxy ingress
  ansible.builtin.assert:
    that:
      - applications_media_egress_proxy_ingress_after_apply.resources | length == 1
      - >-
        applications_media_egress_proxy_ingress_after_apply.resources[0].spec.ingress
        | map(attribute='from', default=[]) | flatten
        | map(attribute='podSelector.matchLabels', default={})
        | map('to_json') | select('search', 'document-purge-worker')
        | list | length == 0
    fail_msg: >-
      media-egress-proxy-ingress still admits document-purge-worker although
      document_purge_enabled is false.
  when:
    - media_egress_proxy_enabled | default(false) | bool
    - not (document_purge_enabled | default(false) | bool)

- name: Remove obsolete Phase 0 web BFF environment variables
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ learning_platform_namespace }}'
    name: web
    state: present
    merge_type:
      - strategic-merge
    definition:
      metadata:
        name: web
        namespace: '{{ learning_platform_namespace }}'
      spec:
        template:
          spec:
            containers:
              - name: web
                env:
                  - name: PHASE0_API_BASE_URL
                    $patch: delete
                  - name: PHASE0_DEV_OWNER_ID
                    $patch: delete
  when: "'web' in deployment_targets"

- name: Read back the web BFF Deployment contract
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ learning_platform_namespace }}'
    name: web
  register: applications_web_deployment_after_apply
  when: "'web' in deployment_targets"
  no_log: true

- name: Require the web BFF Deployment to have no Phase 0 environment variables
  ansible.builtin.assert:
    that:
      - applications_web_deployment_after_apply.resources | length == 1
      - >-
        (applications_web_deployment_after_apply.resources[0].spec.template.spec.containers
        | selectattr('name', 'equalto', 'web')
        | map(attribute='env')
        | first
        | default([])
        | map(attribute='name')
        | intersect(['PHASE0_API_BASE_URL', 'PHASE0_DEV_OWNER_ID'])
        | list) == []
    fail_msg: >-
      The web BFF Deployment still contains obsolete Phase 0 environment
      variables after the source-managed application apply.
  when: "'web' in deployment_targets"
  no_log: true
