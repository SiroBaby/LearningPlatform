---
# Enabled media uploads create MEDIA_PROBE jobs; without the worker those
# Documents would stay PROBING indefinitely.
- name: Require the media probe worker whenever API media uploads are enabled
  ansible.builtin.assert:
    that:
      - not (api_media_enabled | default(false) | bool) or (media_probe_worker_enabled | default(false) | bool)
    fail_msg: >-
      api_media_enabled requires media_probe_worker_enabled; otherwise uploaded
      media Documents wait in PROBING with no worker to probe them.

- name: Validate enabled media probe worker contract
  ansible.builtin.assert:
    that:
      - media_probe_worker_image is string
      - media_probe_worker_image is match('^ghcr\\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$')
      - media_probe_worker_resources is mapping
      - media_probe_worker_proxy_url is string
      - media_probe_worker_proxy_url is match('^https?://[A-Za-z0-9.-]+:[0-9]+$')
      - media_probe_worker_proxy_url is not search('REPLACE_WITH')
      - media_egress_proxy_enabled | default(false) | bool
      - media_probe_worker_database_cidrs is sequence
      - media_probe_worker_database_cidrs is not string
      - media_probe_worker_database_cidrs | length > 0
      - media_probe_worker_database_cidrs | select('match', '^[0-9]{1,3}(\\.[0-9]{1,3}){3}/([0-9]|[12][0-9]|3[0-2])$') | list | length == media_probe_worker_database_cidrs | length
      - media_probe_worker_database_cidrs | select('search', 'REPLACE_WITH') | list | length == 0
      - media_probe_worker_database_cidrs | select('equalto', '0.0.0.0/0') | list | length == 0
    fail_msg: >-
      The media-probe-worker requires an immutable image, bounded resources,
      the explicitly enabled in-cluster media egress proxy, and explicit
      non-default CIDRs for the external PostgreSQL service.
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"
