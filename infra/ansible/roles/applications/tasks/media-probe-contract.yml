---
# Enabled media uploads create MEDIA_PROBE jobs; without the worker those
# Documents would stay PROBING indefinitely.
- name: Require the media probe worker whenever API media uploads are enabled
  ansible.builtin.assert:
    that:
      - not (api_media_enabled | default(false) | bool) or (media_probe_worker_enabled | default(false) | bool)
    fail_msg: >-
      api_media_enabled requires media_probe_worker_enabled; otherwise uploaded
      media Documents wait in PROBING with no worker to probe them.

- name: Require a boolean audio preparation flag that never runs without the probe worker
  ansible.builtin.assert:
    that:
      - media_probe_audio_prep_enabled | default(false) is boolean
      - not (media_probe_audio_prep_enabled | default(false) | bool) or (media_probe_worker_enabled | default(false) | bool)
    fail_msg: >-
      media_probe_audio_prep_enabled must be a boolean and requires
      media_probe_worker_enabled, because ffmpeg runs only inside the probe worker.

- name: Require a boolean media STT flag that never runs without derived audio
  ansible.builtin.assert:
    that:
      - go_worker_media_stt_enabled | default(false) is boolean
      - not (go_worker_media_stt_enabled | default(false) | bool) or (media_probe_worker_enabled | default(false) | bool)
      - not (go_worker_media_stt_enabled | default(false) | bool) or (media_probe_audio_prep_enabled | default(false) | bool)
    fail_msg: >-
      go_worker_media_stt_enabled must be a boolean and requires media_probe_worker_enabled and
      media_probe_audio_prep_enabled: without the probe's derived-audio manifest every media Document would
      fail with MEDIA_AUDIO_NOT_PREPARED.

- name: Validate enabled media probe worker contract
  ansible.builtin.assert:
    that:
      - media_probe_worker_image is string
      - media_probe_worker_image is match('^ghcr\\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$')
      - media_probe_worker_resources is mapping
      - media_probe_worker_proxy_url is string
      - media_probe_worker_proxy_url is match('^https?://[A-Za-z0-9.-]+:[0-9]+$')
      - media_probe_worker_proxy_url is not search('REPLACE_WITH')
      - media_egress_proxy_enabled | default(false) | bool
      - media_probe_database_upstream_host is string
      - media_probe_database_upstream_host is not search('REPLACE_WITH')
      - media_probe_database_upstream_host | length <= 253
      - media_probe_database_upstream_host is match('^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z][a-z0-9-]{0,61}[a-z0-9]$')
      - media_probe_database_upstream_port is not string
      - media_probe_database_upstream_port is not boolean
      - media_probe_database_upstream_port is number
      - media_probe_database_upstream_port is integer
      - media_probe_database_upstream_port | int >= 1
      - media_probe_database_upstream_port | int <= 65535
    fail_msg: >-
      The media-probe-worker requires an immutable image, bounded resources,
      the explicitly enabled in-cluster media egress proxy, and one explicit
      PostgreSQL upstream for the media-probe-db-egress forwarder: a lowercase
      fully qualified host name and an integer port from 1 to 65535.
  when: "'worker' in deployment_targets and media_probe_worker_enabled | default(false) | bool"
