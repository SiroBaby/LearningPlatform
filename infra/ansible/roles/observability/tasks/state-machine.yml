---
- name: Derive release ownership and retention contract
  ansible.builtin.set_fact:
    observability_release_pvcs_owned: >-
      {{ observability_release_pvcs | selectattr('metadata.labels', 'defined')
         | selectattr('metadata.labels.app.kubernetes.io/instance', 'defined')
         | selectattr('metadata.labels.app.kubernetes.io/instance', 'equalto', observability_release.name)
         | list }}
    observability_release_retention_valid: >-
      {{ observability_release_retention_policies | default([]) | length > 0 and
         (observability_release_retention_policies | selectattr('whenDeleted', 'equalto', 'Retain')
         | selectattr('whenScaled', 'equalto', 'Retain') | list | length) ==
         (observability_release_retention_policies | length) }}

- name: Derive the exact four-state Helm release machine
  ansible.builtin.set_fact:
    observability_release_state: >-
      {% if observability_release_records | length == 0 and observability_release_pvcs | length == 0 %}absent
      {% elif observability_release_records | length == 0 %}orphan
      {% elif observability_release_records | length != 1 %}mismatch
      {% elif observability_release_records[0].status | lower != 'deployed' %}partial
      {% elif observability_release_pvcs | length != observability_release_pvcs_owned | length %}mismatch
      {% elif not observability_release_retention_valid %}mismatch
      {% elif observability_release_records[0].healthy | default(true) | bool %}healthy
      {% else %}partial{% endif %}
