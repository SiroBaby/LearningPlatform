- name: monitoring-live-resources-select-exact-owners-and-retention
  release_key: monitoring
  records:
    - {status: deployed, healthy: true}
  namespace_pvcs:
    - metadata:
        name: storage-learning-platform-monitoring-grafana-0
        labels:
          app.kubernetes.io/instance: learning-platform-monitoring
    - metadata:
        name: prometheus-learning-platform-monitori-prometheus-db-prometheus-learning-platform-monitori-prometheus-0
        labels:
          app.kubernetes.io/instance: learning-platform-monitori-prometheus
    - metadata:
        name: data-learning-platform-loki-0
        labels:
          app.kubernetes.io/instance: learning-platform-loki
  namespace_statefulsets:
    - metadata:
        name: learning-platform-monitoring-grafana
        labels:
          app.kubernetes.io/instance: learning-platform-monitoring
      spec:
        persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
    - metadata:
        name: prometheus-learning-platform-monitori-prometheus
        labels:
          app.kubernetes.io/instance: learning-platform-monitori-prometheus
      spec:
        persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
    - metadata:
        name: learning-platform-loki
        labels:
          app.kubernetes.io/instance: learning-platform-loki
      spec:
        persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  namespace_prometheuses:
    - metadata:
        name: learning-platform-monitori-prometheus
        labels:
          app.kubernetes.io/instance: learning-platform-monitori-prometheus
      spec:
        persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  expected_release_pvc_names:
    - storage-learning-platform-monitoring-grafana-0
    - prometheus-learning-platform-monitori-prometheus-db-prometheus-learning-platform-monitori-prometheus-0
  expected_unknown_owner_pvc_names: []
  expected_retention_policies:
    - {whenDeleted: Retain, whenScaled: Retain}
    - {whenDeleted: Retain, whenScaled: Retain}
    - {whenDeleted: Retain, whenScaled: Retain}
  expected_state: healthy
