- name: Verify malformed Grafana ESO template fixtures fail before Kubernetes mutation
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - ../../../vars/dev.yml
  vars:
    ansible_architecture: x86_64
    observability_kubernetes_mutation_count: 0
  tasks:
    - name: Run malformed Grafana ESO template cases
      ansible.builtin.include_tasks: malformed-template-case.yml
      loop:
        - name: missing-document
          template: '{{ playbook_dir }}/fixtures/grafana-external-secret-missing.yaml.j2'
          expected_failed_task: Fail before Helm when the Grafana ExternalSecret contract is absent
        - name: extra-document
          template: '{{ playbook_dir }}/fixtures/grafana-external-secret-extra.yaml.j2'
          expected_failed_task: Validate rendered Grafana ESO documents before Kubernetes mutation
        - name: wrong-kind
          template: '{{ playbook_dir }}/fixtures/grafana-external-secret-wrong-kind.yaml.j2'
          expected_failed_task: Validate rendered Grafana ESO documents before Kubernetes mutation
        - name: wrong-remote-ref-path
          template: '{{ playbook_dir }}/fixtures/grafana-external-secret-wrong-path.yaml.j2'
          expected_failed_task: Validate rendered Grafana ESO documents before Kubernetes mutation
      loop_control:
        loop_var: observability_malformed_template_case

    - name: Require malformed template fixtures to avoid Kubernetes mutation
      ansible.builtin.assert:
        that:
          - observability_kubernetes_mutation_count == 0
        fail_msg: Malformed Grafana ESO templates must fail before Kubernetes mutation.
