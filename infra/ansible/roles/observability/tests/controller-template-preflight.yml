---
- name: Verify Grafana ExternalSecret template preflight runs on the controller
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - ../../../vars/dev.yml
  vars:
    ansible_architecture: x86_64
    observability_remote_repo_source_path: /tmp/learning-platform-remote-source-is-absent
  pre_tasks:
    - name: Confirm the simulated remote VPS has no repository source tree
      ansible.builtin.stat:
        path: '{{ observability_remote_repo_source_path }}'
      register: observability_remote_repo_source

    - name: Require the simulated remote VPS source tree to be absent
      ansible.builtin.assert:
        that:
          - not observability_remote_repo_source.stat.exists

  tasks:
    - name: Prove the legacy single-document parser rejects the actual Grafana template
      block:
        - name: Parse the actual Grafana template with the legacy filter
          ansible.builtin.debug:
            msg: >-
              {{ lookup('template', playbook_dir ~ '/../templates/grafana-external-secret.yaml.j2')
                 | from_yaml }}
          no_log: true
      rescue:
        - name: Record the expected legacy multi-document parsing failure
          ansible.builtin.set_fact:
            observability_legacy_parser_failed: true

    - name: Require the legacy parser regression to be reproducible
      ansible.builtin.assert:
        that:
          - observability_legacy_parser_failed | default(false)
        fail_msg: The actual two-document Grafana template must reject from_yaml.

    - name: Run the observability role when the controller template exists
      ansible.builtin.include_role:
        name: observability

    - name: Require the actual template to parse into the exact ESO documents
      ansible.builtin.assert:
        that:
          - observability_grafana_eso_definitions | length == 2
          - observability_grafana_eso_definitions | map(attribute='kind') | list == ['SecretStore', 'ExternalSecret']
          - observability_grafana_eso_definitions[0].metadata.name == 'aws-parameter-store'
          - observability_grafana_eso_definitions[0].metadata.namespace == observability_namespace
          - observability_grafana_eso_definitions[1].metadata.name == grafana_admin_secret_name
          - observability_grafana_eso_definitions[1].metadata.namespace == observability_namespace
          - >-
            observability_grafana_eso_definitions[1].spec.data
            | map(attribute='remoteRef.key') | list
            == [ssm_parameter_keys.grafana_admin_user, ssm_parameter_keys.grafana_admin_password]

    - name: Require the Alertmanager template to render the exact secret contract
      ansible.builtin.assert:
        that:
          - observability_alertmanager_eso_definition.kind == 'ExternalSecret'
          - observability_alertmanager_eso_definition.metadata.name == alertmanager_config_secret_name
          - observability_alertmanager_eso_definition.metadata.namespace == observability_namespace
          - observability_alertmanager_eso_definition.spec.secretStoreRef.name == 'aws-parameter-store'
          - observability_alertmanager_eso_definition.spec.target.name == alertmanager_config_secret_name
          - observability_alertmanager_eso_definition.spec.target.template.engineVersion == 'v2'
          - observability_alertmanager_eso_definition.spec.target.template.mergePolicy == 'Replace'
          - >-
            observability_alertmanager_eso_definition.spec.data
            | map(attribute='remoteRef.key') | list
            == [ssm_parameter_keys.alertmanager_telegram_bot_token, ssm_parameter_keys.alertmanager_telegram_chat_id]
          - >-
            observability_alertmanager_eso_definition.spec.target.template.data['alertmanager.yaml']
            is search('bot_token:\s+\x27\{\{ \.telegram_bot_token \}\}\x27')
          - >-
            observability_alertmanager_eso_definition.spec.target.template.data['alertmanager.yaml']
            is search('chat_id:\s+\{\{ \.telegram_chat_id \}\}')

    - name: Require the controller preflight to precede every Helm action
      ansible.builtin.assert:
        that:
          - >-
            lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/main.yml')
            is search('delegate_to: localhost')
          - >-
            lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/main.yml')
            is search('ansible.builtin.slurp')
          - >-
            lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/main.yml').find(
              'Fail before Helm when the Grafana ExternalSecret contract is absent'
            ) < lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/main.yml').find(
              'Process each observability Helm release through its state machine'
            )
          - >-
            lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/main.yml').find(
              'Validate rendered Grafana ESO documents before Kubernetes mutation'
            ) < lookup('ansible.builtin.file', playbook_dir ~ '/../tasks/main.yml').find(
              'Create observability namespace'
            )

- name: Verify a missing controller template blocks before Helm
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars_files:
    - ../../../vars/dev.yml
  vars:
    ansible_architecture: x86_64
    observability_grafana_external_secret_template: /tmp/learning-platform-missing-grafana-external-secret.yaml.j2
    observability_helm_action_count: 0
    observability_expected_template_preflight_failed: false
  tasks:
    - name: Run the observability role with a missing controller template
      block:
        - name: Include observability role with a missing controller template
          ansible.builtin.include_role:
            name: observability
      rescue:
        - name: Require the preflight failure before Helm mutation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Fail before Helm when the Grafana ExternalSecret contract is absent'
              - observability_helm_action_count == 0
            fail_msg: Missing controller template must fail before any Helm action.

        - name: Record the expected controller template preflight failure
          ansible.builtin.set_fact:
            observability_expected_template_preflight_failed: true

    - name: Require the missing controller template to fail before Helm
      ansible.builtin.assert:
        that:
          - observability_expected_template_preflight_failed
        fail_msg: Missing controller template unexpectedly allowed the observability role to continue.

