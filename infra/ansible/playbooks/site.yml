---
- name: Configure the Learning Platform single-node K3s host
  hosts: k3s_nodes
  become: true
  gather_facts: true
  roles:
    - role: k3s
      tags: [k3s]
    - role: external_secrets
      tags: [external_secrets]
    - role: applications
      tags: [applications]
    - role: monitoring
      tags: [monitoring]
      when: monitoring_enabled | bool
