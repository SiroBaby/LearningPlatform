---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: learning-platform-monitori-learning-platform-application, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring}}
spec:
  groups:
    - name: learning-platform.application
      rules:
        - alert: LearningPlatformPodNotReady
          expr: kube_pod_status_ready{namespace="learning-platform-dev",pod=~"api-.*|web-.*|worker-.*",condition="true"} == 0
          for: 10m
        - alert: LearningPlatformContainerCrashLoop
          expr: kube_pod_container_status_waiting_reason{namespace="learning-platform-dev",pod=~"api-.*|web-.*|worker-.*",reason="CrashLoopBackOff"} == 1 or sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{namespace="learning-platform-dev",pod=~"api-.*|web-.*|worker-.*"}[15m])) > 3
          for: 10m
        - alert: LearningPlatformDeploymentUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="learning-platform-dev",deployment=~"web|api|worker"} > 0
          for: 10m
        - alert: LearningPlatformWorkerUnhealthy
          expr: kube_pod_container_status_ready{namespace="learning-platform-dev",pod=~"worker-.*",container=~"worker|go-worker",condition="true"} == 0
          for: 10m
---
apiVersion: v1
kind: ConfigMap
metadata: {name: learning-platform-monitoring-meta, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: learning-platform-monitoring-grafana, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring, app.kubernetes.io/name: grafana}}
data:
  grafana.ini: |
    [server]
    root_url = https://grafana.sirobabycloud.io.vn/
    domain = grafana.sirobabycloud.io.vn
    enforce_domain = true
    [auth.anonymous]
    enabled = false
    [feature_toggles]
    kubernetesLogsDrilldown = false
    [security]
    cookie_secure = true
    cookie_samesite = lax
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-operated.observability.svc.cluster.local:9090
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://learning-platform-loki.observability.svc.cluster.local:3100
        editable: false
      - name: Alertmanager
        type: alertmanager
        access: proxy
        url: http://learning-platform-monitori-alertmanager.observability.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
        editable: false
  dashboardproviders.yaml: |
    apiVersion: 1
    providers:
      - name: k8s-resources-cluster
        options: {path: /var/lib/grafana/dashboards/k8s-resources-cluster}
      - name: k8s-resources-node
        options: {path: /var/lib/grafana/dashboards/k8s-resources-node}
      - name: k8s-resources-namespace
        options: {path: /var/lib/grafana/dashboards/k8s-resources-namespace}
      - name: nodes
        options: {path: /var/lib/grafana/dashboards/nodes}
      - name: application-pod
        options: {path: /var/lib/grafana/dashboards/application-pod}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: learning-platform-monitoring-grafana-dashboards-application-pod, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring, dashboard-provider: application-pod}}
data:
  application-pod.json: |
    {"title":"Application / Pod","templating":{"list":[{"name":"namespace","current":{"value":"learning-platform-dev"}},{"name":"workload","query":"label_values(kube_deployment_spec_replicas{namespace=~\"$namespace\"}, deployment)"},{"name":"pod","query":"label_values(kube_pod_status_ready{namespace=~\"$namespace\",pod=~\"$workload.*\"}, pod)"},{"name":"container","query":"label_values(kube_pod_container_status_ready{namespace=~\"$namespace\",pod=~\"$pod\"}, container)"}]},"panels":[{"title":"Pod ready","targets":[{"expr":"kube_pod_status_ready{namespace=~\"$namespace\",pod=~\"$pod\"}"}]},{"title":"Container ready","targets":[{"expr":"kube_pod_container_status_ready{namespace=~\"$namespace\",pod=~\"$pod\",container=~\"$container\",condition=\"true\"}"}]},{"title":"Pod phase","type":"timeseries","targets":[{"expr":"sum by (phase) (kube_pod_status_phase{namespace=~\"$namespace\",pod=~\"$pod\",phase=~\"Running|Pending|Failed\"} == 1)"}]},{"title":"Restarts","targets":[{"expr":"kube_pod_container_status_restarts_total{namespace=~\"$namespace\",pod=~\"$pod\",container=~\"$container\"}"}]},{"title":"CrashLoopBackOff","targets":[{"expr":"kube_pod_container_status_waiting_reason{namespace=~\"$namespace\",pod=~\"$pod\",container=~\"$container\",reason=\"CrashLoopBackOff\"}"}]},{"title":"Replicas","targets":[{"expr":"kube_deployment_spec_replicas{namespace=~\"$namespace\",deployment=~\"$workload\"}"},{"expr":"kube_deployment_status_replicas_available{namespace=~\"$namespace\",deployment=~\"$workload\"}"}]},{"title":"CPU","targets":[{"expr":"container_cpu_usage_seconds_total{namespace=~\"$namespace\",pod=~\"$pod\",container=~\"$container\"}"}]},{"title":"Memory","targets":[{"expr":"container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"$pod\",container=~\"$container\"}"}]},{"title":"Log drilldown","targets":[{"expr":"{namespace=~\"$namespace\",pod=~\"$pod\",container=~\"$container\"}"}]}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: learning-platform-loki-meta, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-loki, app.kubernetes.io/version: 3.7.4}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loki, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-loki, app.kubernetes.io/name: loki, app.kubernetes.io/version: 3.7.4}}
data:
  config.yaml: |
    auth_enabled: false
    common:
      replication_factor: 1
    schema_config:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
---
apiVersion: v1
kind: ConfigMap
metadata: {name: learning-platform-alloy-config, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-alloy, app.kubernetes.io/version: v1.18.0}}
data:
  config.alloy: |
    discovery.relabel "pod_logs" {
      rule { source_labels = ["__meta_kubernetes_pod_name"] action = "replace" target_label = "pod" }
    }
    stage.label_keep { values = ["cluster", "namespace", "app", "container", "pod", "stream"] }
---
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata: {name: learning-platform-monitoring-prometheus, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring}}
spec:
  alerting:
    alertmanagers:
      - namespace: observability
        name: learning-platform-monitori-alertmanager
        port: http-web
        pathPrefix: "/"
        apiVersion: v2
  retention: 7d
  retentionSize: 2500MB
  resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
  containers:
    - name: config-reloader
      resources: {requests: {cpu: 15m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
  storage:
    volumeClaimTemplate:
      spec: {storageClassName: local-path, resources: {requests: {storage: 3Gi}}}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata: {name: learning-platform-monitori-alertmanager, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring}}
spec:
  replicas: 1
  configSecret: alertmanager-telegram-config
  resources: {requests: {cpu: 35m, memory: 64Mi}, limits: {cpu: 100m, memory: 128Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: learning-platform-monitoring-operator, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring, app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator}}
spec:
  template:
    spec:
      containers:
        - name: kube-prometheus-stack
          args: [--config-reloader-cpu-request=15m, --config-reloader-memory-request=32Mi, --config-reloader-cpu-limit=100m, --config-reloader-memory-limit=64Mi]
          resources: {requests: {cpu: 35m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
          volumeMounts: []
      volumes: []
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: learning-platform-monitoring-grafana, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring, app.kubernetes.io/name: grafana}}
spec:
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  volumeClaimTemplates:
    - spec: {storageClassName: local-path, resources: {requests: {storage: 1Gi}}}
  template:
    spec:
      volumes:
        - name: dashboards-k8s-resources-cluster
          configMap: {name: learning-platform-monitori-k8s-resources-cluster}
        - name: dashboards-k8s-resources-node
          configMap: {name: learning-platform-monitori-k8s-resources-node}
        - name: dashboards-k8s-resources-namespace
          configMap: {name: learning-platform-monitori-k8s-resources-namespace}
        - name: dashboards-nodes
          configMap: {name: learning-platform-monitori-nodes}
        - name: dashboards-application-pod
          configMap: {name: learning-platform-monitoring-grafana-dashboards-application-pod}
      containers:
        - name: grafana
          volumeMounts:
            - name: dashboards-k8s-resources-cluster
              mountPath: /var/lib/grafana/dashboards/k8s-resources-cluster
            - name: dashboards-k8s-resources-node
              mountPath: /var/lib/grafana/dashboards/k8s-resources-node
            - name: dashboards-k8s-resources-namespace
              mountPath: /var/lib/grafana/dashboards/k8s-resources-namespace
            - name: dashboards-nodes
              mountPath: /var/lib/grafana/dashboards/nodes
            - name: dashboards-application-pod
              mountPath: /var/lib/grafana/dashboards/application-pod/application-pod.json
          resources: {requests: {cpu: 75m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: learning-platform-monitoring-kube-state-metrics, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring, app.kubernetes.io/name: kube-state-metrics}}
spec:
  template:
    spec:
      containers:
        - name: kube-state-metrics
          resources: {requests: {cpu: 35m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: learning-platform-monitoring-node-exporter, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring, app.kubernetes.io/name: prometheus-node-exporter}}
spec:
  template:
    spec:
      containers:
        - name: node-exporter
          resources: {requests: {cpu: 15m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: learning-platform-loki, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-loki, app.kubernetes.io/name: loki}}
spec:
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  volumeClaimTemplates:
    - spec: {storageClassName: local-path, resources: {requests: {storage: 2Gi}}}
  template:
    spec:
      containers:
        - name: loki
          resources: {requests: {cpu: 120m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: learning-platform-alloy, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-alloy, app.kubernetes.io/name: alloy}}
spec:
  template:
    spec:
      hostNetwork: false
      hostPID: false
      volumes:
        - name: alloy-storage
          emptyDir:
            sizeLimit: 128Mi
      containers:
        - name: alloy
          args: [run, /etc/alloy/config.alloy, --storage.path=/tmp/alloy]
          securityContext: {privileged: false, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 473}
          volumeMounts:
            - name: alloy-storage
              mountPath: /tmp/alloy
          resources: {requests: {cpu: 60m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
        - name: config-reloader
          securityContext: {privileged: false, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534}
          resources: {requests: {cpu: 5m, memory: 50Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: learning-platform-alloy, labels: {app.kubernetes.io/instance: learning-platform-alloy, app.kubernetes.io/name: alloy}}
rules:
  - resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: v1
kind: Service
metadata: {name: learning-platform-monitoring-grafana, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring, app.kubernetes.io/name: grafana}}
spec: {type: ClusterIP}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: learning-platform-monitoring-grafana, namespace: observability, labels: {app.kubernetes.io/instance: learning-platform-monitoring, app.kubernetes.io/name: grafana}}
spec:
  rules:
    - host: grafana.sirobabycloud.io.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: learning-platform-monitoring-grafana, port: {number: 80}}}
