deploymentMode: Monolithic

minio:
  enabled: false

gateway:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # Ruler runs inside the monolithic pod (-target=all). Rules come from the
  # ConfigMap below, mounted read-only under the tenant directory "fake"
  # because auth_enabled is false.
  rulerConfig:
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    rule_path: /var/loki/ruler-scratch
    alertmanager_url: http://learning-platform-monitori-alertmanager.observability.svc.cluster.local:9093
    enable_api: true

singleBinary:
  replicas: 1
  sidecar: false
  resources:
    requests:
      cpu: 120m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
  extraVolumes:
    - name: alert-rules
      configMap:
        name: learning-platform-loki-alert-rules
  extraVolumeMounts:
    - name: alert-rules
      mountPath: /etc/loki/rules/fake
      readOnly: true
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    storageClass: local-path
    enableStatefulSetAutoDeletePVC: true
    whenDeleted: Retain
    whenScaled: Retain

write:
  enabled: false
  replicas: 0

read:
  enabled: false
  replicas: 0

backend:
  enabled: false
  replicas: 0

ingester:
  enabled: false
  replicas: 0

distributor:
  enabled: false
  replicas: 0

querier:
  enabled: false
  replicas: 0

queryFrontend:
  enabled: false
  replicas: 0

queryScheduler:
  enabled: false
  replicas: 0

indexGateway:
  enabled: false
  replicas: 0

compactor:
  enabled: false
  replicas: 0

bloomGateway:
  enabled: false
  replicas: 0

bloomPlanner:
  enabled: false
  replicas: 0

bloomBuilder:
  enabled: false
  replicas: 0

patternIngester:
  enabled: false
  replicas: 0

# enabled renders the ruler block into the monolithic config; replicas stays 0
# so the chart never creates a separate ruler workload.
ruler:
  enabled: true
  replicas: 0

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: learning-platform-loki-alert-rules
      namespace: observability
    data:
      document-purge.yaml: |
        groups:
          - name: learning-platform.document-purge
            rules:
              - alert: DocumentPurgeDeadLettered
                expr: >-
                  sum by (namespace) (count_over_time({namespace="learning-platform-dev", container="document-purge-worker"} |= "document.purge.dead_lettered" [10m])) > 0
                labels:
                  severity: warning
                annotations:
                  summary: Document purge manifest moved to dead-letter
                  description: >-
                    A purge manifest exhausted its attempts. Follow docs/deployment/RUNBOOK-document-purge-dev.md section 7.
              - alert: DocumentPurgePreflightFailed
                expr: >-
                  sum by (namespace) (count_over_time({namespace="learning-platform-dev", container="document-purge-worker"} |= "document.purge.preflight.failed" [10m])) > 0
                labels:
                  severity: critical
                annotations:
                  summary: Document purge worker failed its storage preflight
                  description: >-
                    The purge worker cannot confirm media bucket versioning and will not become ready.
              - alert: DocumentPurgeBacklogStale
                expr: >-
                  max by (namespace) (last_over_time({namespace="learning-platform-dev", container="document-purge-worker"} |= "document.purge.backlog\"" | json oldestPendingAgeSeconds="message.oldestPendingAgeSeconds" | __error__="" | unwrap oldestPendingAgeSeconds [15m])) > 3600
                labels:
                  severity: warning
                annotations:
                  summary: Document purge manifest waiting for over an hour
                  description: >-
                    The oldest due PENDING/FAILED purge manifest has waited longer than 3600 seconds. Follow docs/deployment/RUNBOOK-document-purge-dev.md section 8.
              - alert: DocumentPurgeBacklogMissing
                expr: >-
                  sum by (namespace) (count_over_time({namespace="learning-platform-dev", container="document-purge-worker"} |= "\"document.purge.backlog" [1h])) unless sum by (namespace) (count_over_time({namespace="learning-platform-dev", container="document-purge-worker"} |= "document.purge.backlog\"" [15m])) unless sum by (namespace) (count_over_time({namespace="learning-platform-dev", container="document-purge-worker"} |= "document.purge.shutdown.completed" [1h]))
                labels:
                  severity: warning
                annotations:
                  summary: Document purge worker stopped reporting its backlog
                  description: >-
                    The purge worker reported its backlog within the last hour but no document.purge.backlog log arrived for 15 minutes. Follow docs/deployment/RUNBOOK-document-purge-dev.md section 8.
