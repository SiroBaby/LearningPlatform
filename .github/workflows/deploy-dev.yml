name: Deploy development VPS

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: Services to build and deploy; overrides repository diff classification.
        required: true
        default: all
        type: choice
        options:
          - web
          - api
          - worker
          - observability
          - all

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  changes:
    name: Classify deploy changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      web: ${{ steps.classify.outputs.web }}
      api: ${{ steps.classify.outputs.api }}
      worker: ${{ steps.classify.outputs.worker }}
      observability: ${{ steps.classify.outputs.observability }}
      backend: ${{ steps.classify.outputs.backend }}
      deploy_any: ${{ steps.classify.outputs.deploy_any }}
    steps:
      # actions/checkout v4, verified against refs/tags/v4 on 2026-07-18.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: classify
        env:
          TARGET: ${{ inputs.target || 'auto' }}
          BEFORE_SHA: ${{ github.event.before || github.sha }}
          AFTER_SHA: ${{ github.sha }}
        run: deploy/dev/classify-changes.sh "$TARGET" "$BEFORE_SHA" "$AFTER_SHA" >> "$GITHUB_OUTPUT"

  backend-quality:
    name: Backend quality
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      # actions/checkout v4, verified against refs/tags/v4 on 2026-07-18.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # actions/setup-node v4, verified against refs/tags/v4 on 2026-07-18.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: node ../deploy/dev/audit-high.js
      - run: npm test -- --runInBand
      - run: npm run test:e2e -- --runInBand
      - run: npm run build
      - run: npx tsc -p tsconfig.spec.json --noEmit

  frontend-quality:
    name: Frontend quality
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      # actions/checkout v4, verified against refs/tags/v4 on 2026-07-18.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # actions/setup-node v4, verified against refs/tags/v4 on 2026-07-18.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node ../deploy/dev/audit-high.js
      - run: npm run lint
      - run: npm run build

  infra-quality:
    name: Infrastructure and observability policy
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate infrastructure source contract
        run: bash infra/scripts/validate.sh
      - name: Validate rendered observability policy fixtures
        run: ruby infra/scripts/tests/test-rendered-observability-policy.rb
      - name: Render and validate pinned observability chart archives
        run: bash infra/scripts/test-real-render-observability.sh
      - name: Validate deployment workflow target policy
        run: bash deploy/dev/tests/test-deploy-dev-workflow.sh

  build-images:
    name: Build and push images
    needs: [changes, backend-quality, frontend-quality, infra-quality]
    if: always() && needs.changes.outputs.deploy_any == 'true' && (needs.backend-quality.result == 'success' || needs.backend-quality.result == 'skipped') && (needs.frontend-quality.result == 'success' || needs.frontend-quality.result == 'skipped') && (needs.infra-quality.result == 'success' || needs.infra-quality.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.api-build.outputs.digest }}
      web_digest: ${{ steps.web-build.outputs.digest }}
    steps:
      # actions/checkout v4, verified against refs/tags/v4 on 2026-07-18.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # docker/login-action v3, verified against refs/tags/v3 on 2026-07-18.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/build-push-action v6, verified against refs/tags/v6 on 2026-07-18.
      - id: api-build
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: app
          push: true
          tags: ghcr.io/sirobaby/learningplatform-api:sha-${{ github.sha }}
      # docker/build-push-action v6, verified against refs/tags/v6 on 2026-07-18.
      - id: web-build
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: web
          push: true
          tags: ghcr.io/sirobaby/learningplatform-web:sha-${{ github.sha }}

  deploy:
    name: Deploy immutable digests to K3s
    needs: [changes, infra-quality, build-images]
    if: always() && needs.changes.outputs.deploy_any == 'true' && needs.build-images.result == 'success' && (needs.infra-quality.result == 'success' || needs.infra-quality.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
    steps:
      # actions/checkout v4, verified against refs/tags/v4 on 2026-07-18.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned Ansible tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir 'ansible-core==2.21.2'
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection install -r infra/ansible/requirements.yml
      - name: Create ephemeral Ansible inventory and deployment overrides
        env:
          VPS_HOST: ${{ vars.DEV_VPS_HOST }}
          VPS_USER: ${{ vars.DEV_VPS_USER }}
          SELECT_WEB: ${{ needs.changes.outputs.web }}
          SELECT_API: ${{ needs.changes.outputs.api }}
          SELECT_WORKER: ${{ needs.changes.outputs.worker }}
          WEB_DIGEST: ${{ needs.build-images.outputs.web_digest }}
          BACKEND_DIGEST: ${{ needs.build-images.outputs.api_digest }}
        run: |
          DEPLOYMENT_DIR="$(mktemp -d "$RUNNER_TEMP/dev-k3s-deploy.XXXXXX")"
          printf '%s\n' "$DEPLOYMENT_DIR" > "$RUNNER_TEMP/dev-k3s-deploy-path"
          chmod 700 "$DEPLOYMENT_DIR"
          export DEPLOYMENT_DIR
          python3 - <<'PY'
          import os
          import re
          import sys
          import json

          host, user = os.environ['VPS_HOST'], os.environ['VPS_USER']
          if not host or not user: sys.exit('VPS_HOST and VPS_USER must be non-empty')
          if not re.fullmatch(r'[A-Za-z0-9._-]+', user): sys.exit('VPS_USER contains unsupported characters')
          if not re.fullmatch(r'[A-Za-z0-9.-]+', host): sys.exit('VPS_HOST contains unsupported characters')
          selected = [name for name in ('web', 'api', 'worker') if os.environ[f'SELECT_{name.upper()}'] == 'true']
          if not selected: sys.exit('no services were selected for deployment')
          image_overrides = {}
          if 'web' in selected:
              digest = os.environ['WEB_DIGEST']
              if not re.fullmatch(r'sha256:[a-f0-9]{64}', digest): sys.exit('web digest is not immutable')
              image_overrides['web_image'] = f'ghcr.io/sirobaby/learningplatform-web@{digest}'
          backend_digest = os.environ['BACKEND_DIGEST']
          if 'api' in selected or 'worker' in selected:
              if not re.fullmatch(r'sha256:[a-f0-9]{64}', backend_digest): sys.exit('backend digest is not immutable')
              if 'api' in selected:
                  image_overrides['api_image'] = f'ghcr.io/sirobaby/learningplatform-api@{backend_digest}'
              if 'worker' in selected:
                  image_overrides['worker_image'] = f'ghcr.io/sirobaby/learningplatform-api@{backend_digest}'
          deployment_dir = os.environ['DEPLOYMENT_DIR']
          with open(f'{deployment_dir}/hosts.yml', 'w', encoding='utf-8') as inventory:
              json.dump({'k3s_nodes': {'hosts': {'dev': {'ansible_host': host, 'ansible_user': user}}}}, inventory)
          with open(f'{deployment_dir}/overrides.yml', 'w', encoding='utf-8') as overrides:
              json.dump({'deployment_targets': selected, **image_overrides}, overrides)
          PY
          chmod 600 "$DEPLOYMENT_DIR/hosts.yml" "$DEPLOYMENT_DIR/overrides.yml"
      - name: Configure SSH trust
        env:
          SSH_KEY: ${{ secrets.DEV_VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Apply selected applications through Ansible
        id: apply-applications
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible/ansible.cfg
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_STDOUT_CALLBACK: default
        run: |
          DEPLOYMENT_DIR="$(<"$RUNNER_TEMP/dev-k3s-deploy-path")"
          "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" -i "$DEPLOYMENT_DIR/hosts.yml" infra/ansible/playbooks/site.yml --tags applications -e "@$DEPLOYMENT_DIR/overrides.yml"
      - name: Diagnose failed database migration gate
        if: failure() && steps.apply-applications.outcome == 'failure' && needs.changes.outputs.backend == 'true'
        env:
          VPS_HOST: ${{ vars.DEV_VPS_HOST }}
          VPS_USER: ${{ vars.DEV_VPS_USER }}
        run: |
          DEPLOYMENT_DIR="$(<"$RUNNER_TEMP/dev-k3s-deploy-path")"
          if ! python3 - "$DEPLOYMENT_DIR/overrides.yml" >/dev/null 2>&1 <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as overrides:
              targets = json.load(overrides)['deployment_targets']
          sys.exit(not any(target in ('api', 'worker') for target in targets))
          PY
          then
            exit 0
          fi
          if ! ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$VPS_USER@$VPS_HOST" 'if ! sudo k3s kubectl get job/database-migrate --namespace learning-platform-dev >/dev/null 2>&1; then exit 0; fi; sudo k3s kubectl describe job/database-migrate --namespace learning-platform-dev || true; sudo k3s kubectl logs job/database-migrate --all-containers=true --namespace learning-platform-dev 2>/dev/null || true'; then
            true
          fi
      - name: Wait for selected K3s rollouts
        env:
          VPS_HOST: ${{ vars.DEV_VPS_HOST }}
          VPS_USER: ${{ vars.DEV_VPS_USER }}
        run: |
          DEPLOYMENT_DIR="$(<"$RUNNER_TEMP/dev-k3s-deploy-path")"
          export DEPLOYMENT_DIR
          python3 - <<'PY' > "$DEPLOYMENT_DIR/selected-targets"
          import json
          import os
          with open(f"{os.environ['DEPLOYMENT_DIR']}/overrides.yml", encoding='utf-8') as overrides:
              for target in json.load(overrides)['deployment_targets']:
                  print(target)
          PY
          while IFS= read -r target; do
            ssh -n -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$VPS_USER@$VPS_HOST" "sudo k3s kubectl rollout status deployment/$target --namespace learning-platform-dev --timeout=180s"
          done < "$DEPLOYMENT_DIR/selected-targets"
      - name: Remove ephemeral deployment files
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/dev-k3s-deploy-path" ]]; then
            DEPLOYMENT_DIR="$(<"$RUNNER_TEMP/dev-k3s-deploy-path")"
            rm -rf -- "$DEPLOYMENT_DIR"
            rm -f -- "$RUNNER_TEMP/dev-k3s-deploy-path"
          fi

  deploy-observability:
    name: Deploy ESO and observability only
    needs: [changes, infra-quality]
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' && inputs.target == 'observability' &&
      needs.changes.outputs.observability == 'true' && needs.infra-quality.result == 'success'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install pinned Ansible tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir 'ansible-core==2.21.2'
          "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy" collection install -r infra/ansible/requirements.yml
      - name: Create ephemeral Ansible inventory
        env:
          VPS_HOST: ${{ vars.DEV_VPS_HOST }}
          VPS_USER: ${{ vars.DEV_VPS_USER }}
        run: |
          DEPLOYMENT_DIR="$(mktemp -d "$RUNNER_TEMP/dev-k3s-observability.XXXXXX")"
          printf '%s\n' "$DEPLOYMENT_DIR" > "$RUNNER_TEMP/dev-k3s-observability-path"
          chmod 700 "$DEPLOYMENT_DIR"
          export DEPLOYMENT_DIR
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          host, user = os.environ['VPS_HOST'], os.environ['VPS_USER']
          if not host or not user: sys.exit('VPS_HOST and VPS_USER must be non-empty')
          if not re.fullmatch(r'[A-Za-z0-9._-]+', user): sys.exit('VPS_USER contains unsupported characters')
          if not re.fullmatch(r'[A-Za-z0-9.-]+', host): sys.exit('VPS_HOST contains unsupported characters')
          with open(f"{os.environ['DEPLOYMENT_DIR']}/hosts.yml", 'w', encoding='utf-8') as inventory:
              json.dump({'k3s_nodes': {'hosts': {'dev': {'ansible_host': host, 'ansible_user': user}}}}, inventory)
          PY
          chmod 600 "$DEPLOYMENT_DIR/hosts.yml"
      - name: Configure SSH trust
        env:
          SSH_KEY: ${{ secrets.DEV_VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
           printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
           chmod 600 ~/.ssh/known_hosts
      - name: Bootstrap observability AWS credential Secret
        env:
          VPS_HOST: ${{ vars.DEV_VPS_HOST }}
          VPS_USER: ${{ vars.DEV_VPS_USER }}
          OBSERVABILITY_AWS_ACCESS_KEY_ID: ${{ secrets.OBSERVABILITY_AWS_ACCESS_KEY_ID }}
          OBSERVABILITY_AWS_SECRET_ACCESS_KEY: ${{ secrets.OBSERVABILITY_AWS_SECRET_ACCESS_KEY }}
        run: |
          CREDENTIAL_DIR="$(mktemp -d "$RUNNER_TEMP/observability-aws-credentials.XXXXXX")"
          chmod 700 "$CREDENTIAL_DIR"
          cleanup_credentials() {
            rm -rf -- "$CREDENTIAL_DIR"
          }
          trap cleanup_credentials EXIT
          export CREDENTIAL_DIR
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          credential_dir = Path(os.environ['CREDENTIAL_DIR'])
          credentials = {
              'access-key-id': os.environ['OBSERVABILITY_AWS_ACCESS_KEY_ID'],
              'secret-access-key': os.environ['OBSERVABILITY_AWS_SECRET_ACCESS_KEY'],
          }
          for filename, value in credentials.items():
              encoded = value.encode('utf-8')
              if not encoded:
                  sys.exit(f'{filename} GitHub Environment Secret must be non-empty')
              if b'\0' in encoded or len(encoded) > 4096:
                  sys.exit(f'{filename} GitHub Environment Secret has an unsupported size or byte')
              destination = credential_dir / filename
              with destination.open('wb') as credential_file:
                  credential_file.write(encoded)
              destination.chmod(0o600)
          PY
          read -r -d '' REMOTE_SCRIPT <<'REMOTE_BASH' || true
          umask 077
          REMOTE_CREDENTIAL_DIR="$(mktemp -d)"
          cleanup_remote_credentials() {
            rm -rf -- "$REMOTE_CREDENTIAL_DIR"
          }
          trap cleanup_remote_credentials EXIT
          tar -C "$REMOTE_CREDENTIAL_DIR" -xf -
          python3 - "$REMOTE_CREDENTIAL_DIR/access-key-id" "$REMOTE_CREDENTIAL_DIR/secret-access-key" <<'PY'
          import os
          import stat
          import sys

          for credential_path in sys.argv[1:]:
              metadata = os.lstat(credential_path)
              if not stat.S_ISREG(metadata.st_mode) or stat.S_ISLNK(metadata.st_mode):
                  sys.exit("credential transport file must be regular")
              content = open(credential_path, "rb").read()
              if not content or len(content) > 4096 or b"\0" in content:
                  sys.exit("credential transport file has an unsupported size or byte")
          PY
          sudo k3s kubectl create namespace observability --dry-run=client -o yaml | sudo k3s kubectl apply -f -
          sudo k3s kubectl create secret generic observability-aws-credentials --namespace observability \
            --from-file=access-key-id="$REMOTE_CREDENTIAL_DIR/access-key-id" \
            --from-file=secret-access-key="$REMOTE_CREDENTIAL_DIR/secret-access-key" \
            --dry-run=client -o yaml | sudo k3s kubectl apply -f -
          SECRET_TYPE="$(sudo k3s kubectl get secret observability-aws-credentials --namespace observability -o jsonpath='{.type}')"
          SECRET_KEYS="$(sudo k3s kubectl get secret observability-aws-credentials --namespace observability -o go-template='{{range $key, $_ := .data}}{{$key}}{{"\n"}}{{end}}' | LC_ALL=C sort)"
          if [[ "$SECRET_TYPE" != Opaque || "$SECRET_KEYS" != $'access-key-id\nsecret-access-key' ]]; then
            printf '%s\n' 'observability credential Secret metadata contract failed' >&2
            exit 1
          fi
          printf '%s\n' 'observability credential Secret metadata verified: type=Opaque key_count=2 keys=access-key-id,secret-access-key'
          REMOTE_BASH
          tar -C "$CREDENTIAL_DIR" -cf - access-key-id secret-access-key | \
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$VPS_USER@$VPS_HOST" "env -u BASH_ENV bash --noprofile --norc -ceu $(printf '%q' "$REMOTE_SCRIPT")"
      - name: Apply External Secrets and observability through Ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible/ansible.cfg
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_STDOUT_CALLBACK: default
        run: |
          DEPLOYMENT_DIR="$(<"$RUNNER_TEMP/dev-k3s-observability-path")"
          "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" -i "$DEPLOYMENT_DIR/hosts.yml" infra/ansible/playbooks/site.yml --tags external_secrets,observability
      - name: Remove ephemeral observability deployment files
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/dev-k3s-observability-path" ]]; then
            DEPLOYMENT_DIR="$(<"$RUNNER_TEMP/dev-k3s-observability-path")"
            rm -rf -- "$DEPLOYMENT_DIR"
            rm -f -- "$RUNNER_TEMP/dev-k3s-observability-path"
          fi
