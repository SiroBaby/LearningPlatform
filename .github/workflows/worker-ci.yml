name: Go worker CI

on:
  pull_request:
    paths:
      - worker/**
      - .github/workflows/worker-ci.yml
  push:
    branches:
      - develop
    paths:
      - worker/**
      - .github/workflows/worker-ci.yml

permissions:
  contents: read

jobs:
  quality:
    name: Go format, vet, test, race, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: worker/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./cmd/ai-worker
